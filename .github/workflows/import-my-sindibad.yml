name: Import MY SINDBAD project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mysindbad
          base64 -d .upload/MY_SINDBAD_CLEAN_APP.zip.b64 > /tmp/mysindbad/app.zip
          unzip -q /tmp/mysindbad/app.zip -d /tmp/mysindbad/extracted
          rm -rf /tmp/mysindbad/extracted/my-sindbad/.git
          cp -a /tmp/mysindbad/extracted/my-sindbad/. .
          rm -rf .upload .github/workflows/import-my-sindbad.yml /tmp/mysindbad

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import MY SINDBAD project"
          git push
